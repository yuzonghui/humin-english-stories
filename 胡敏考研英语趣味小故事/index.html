<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胡敏考研英语趣味小故事</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="js/api.js"></script>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>胡敏小故事</h1>
        <p>听打练习 · 离线版</p>
      </div>
      <nav>
        <button class="nav-btn active" data-page="articles">📚 文章列表</button>
        <button class="nav-btn" data-page="wrong">❌ 错题本</button>
        <button class="nav-btn" data-page="vocab">📖 生词本</button>
        <button class="nav-btn" data-page="settings">⚙️ 设置</button>
      </nav>
    </aside>

    <main class="content">
      <!-- 文章列表 -->
      <section id="page-articles" class="page active">
        <header class="page-header">
          <h2>文章列表</h2>
          <p>共 81 篇故事，点击开始练习</p>
        </header>
        <div id="article-grid" class="article-grid"></div>
      </section>

      <!-- 练习页 -->
      <section id="page-practice" class="page">
        <header class="page-header practice-header">
          <button id="btn-back" class="btn-secondary">← 返回列表</button>
          <div class="practice-title">
            <h2 id="practice-story-title"></h2>
            <span id="practice-progress-text"></span>
          </div>
          <div class="mode-switch">
            <button class="mode-btn active" data-mode="segment">逐句跟读</button>
            <button class="mode-btn" data-mode="blind">盲打听写</button>
          </div>
        </header>

        <div class="practice-body">
          <div id="sentence-display" class="sentence-display"></div>
          <div class="sentence-translation-wrap">
            <span class="translation-label">中文</span>
            <div id="sentence-translation" class="sentence-translation"></div>
          </div>
          <div id="word-hints" class="word-hints"></div>
          <div id="typing-words" class="typing-words"></div>
          <div class="input-area">
            <input type="text" id="typing-input" placeholder="逐词输入，空格分词，全部正确后自动进入下一句" autocomplete="off" spellcheck="false">
            <div class="input-actions">
              <button id="btn-prev" class="btn-secondary">← 上一句</button>
              <button id="btn-next" class="btn-secondary">下一句 →</button>
              <button id="btn-replay" class="btn-secondary">🔊 重听</button>
              <button id="btn-hint" class="btn-secondary">显示提示</button>
            </div>
          </div>
          <div id="feedback" class="feedback"></div>
          <div class="progress-bar-wrap">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>
      </section>

      <!-- 错题本 -->
      <section id="page-wrong" class="page">
        <header class="page-header">
          <h2>错题本</h2>
          <p id="wrong-count"></p>
        </header>
        <div id="wrong-list" class="card-list"></div>
      </section>

      <!-- 生词本 -->
      <section id="page-vocab" class="page">
        <header class="page-header">
          <h2>生词本</h2>
          <p id="vocab-count"></p>
        </header>
        <div id="vocab-list" class="card-list"></div>
      </section>

      <!-- 设置 -->
      <section id="page-settings" class="page">
        <header class="page-header">
          <h2>设置</h2>
        </header>
        <div class="settings-form">
          <label>
            字体大小：<span id="font-size-val">16</span>px
            <input type="range" id="setting-font" min="12" max="24" value="16">
          </label>
          <label>
            护眼模式
            <select id="setting-theme">
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </label>
          <label>
            朗读口音
            <select id="setting-accent">
              <option value="en-US">美音 (US)</option>
              <option value="en-GB">英音 (UK)</option>
            </select>
          </label>
          <label>
            朗读语速：<span id="speech-rate-val">0.9</span>
            <input type="range" id="setting-rate" min="0.5" max="1.5" step="0.1" value="0.9">
          </label>
          <label>
            默认练习模式
            <select id="setting-mode">
              <option value="segment">逐句跟读</option>
              <option value="blind">盲打听写</option>
            </select>
          </label>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
